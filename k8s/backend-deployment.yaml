# ── Backend Deployment ────────────────────────────────────────────────────────
# Tells Kubernetes: "Run 2 copies of our backend container"
# Updated to use ConfigMap, Secret, resource limits, and liveness/readiness probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2                        # 2 pods for fault tolerance (key concept!)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sirivennela04/service-marketplace-backend:v2.0.0
          imagePullPolicy: IfNotPresent       # pull from DockerHub if not cached
          ports:
            - containerPort: 3000
          env:
            # From ConfigMap (non-sensitive)
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT
            # From Secret (sensitive)
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MONGO_URL
          # Resource limits — REQUIRED for HPA to work
          resources:
            requests:
              cpu: "100m"            # 0.1 CPU core (minimum guaranteed)
              memory: "128Mi"        # 128 MB RAM (minimum guaranteed)
            limits:
              cpu: "250m"            # 0.25 CPU core (maximum allowed)
              memory: "256Mi"        # 256 MB RAM (maximum allowed)
          # Readiness probe: is the pod ready to receive traffic?
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness probe: is the pod still alive?
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20