# In production, use tools like Sealed Secrets or Vault for real encryption.

# The base64 value below decodes to: mongodb://mongodb-service:27017/servicedb
# To encode your own: echo -n "your-string" | base64

apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
data:
  MONGO_URL: bW9uZ29kYjovL21vbmdvZGItc2VydmljZToyNzAxNy9zZXJ2aWNlZGI=
